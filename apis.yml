name: OnFarm
description: >-
  OnFarm Systems, founded in 2012 and headquartered in Fresno, California, was
  an agriculture IoT data-integration company that offered a customizable
  dashboard aggregating in-field sensor and remotely gathered data (weather,
  soil, irrigation) into a single view for farming operations across the US,
  Europe, and Asia. OnFarm was acquired by SWIIM System in July 2018, at which
  point CEO Lance Donny became SWIIM's COO. The onfarm.com domain is now parked
  and listed for sale, and no live public API, developer documentation, or SDK
  surface remains. This profile was surfaced as a 500 Global portfolio lead;
  enrichment found no active API surface to harvest.
